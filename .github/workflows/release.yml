name: Release Windows App

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify version matches tag
        shell: pwsh
        run: |
          $packageVersion = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $tagVersion = "${env:GITHUB_REF_NAME}".TrimStart('v')

          Write-Host "package.json version: $packageVersion"
          Write-Host "Git tag version: $tagVersion"

          if ($packageVersion -ne $tagVersion) {
            throw "ERROR: package.json version $packageVersion does not match tag $tagVersion"
          }

      - name: Build and publish Windows release
        run: npx electron-builder --win nsis --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release edit "${env:GITHUB_REF_NAME}" --draft=false --latest=true